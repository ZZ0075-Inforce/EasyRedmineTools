<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Easy Redmine Issue Tracker</title>
    <style>
      :root {
        --bg: linear-gradient(135deg, #f7f1e3 0%, #dfe9f3 100%);
        --panel: rgba(255, 255, 255, 0.86);
        --panel-border: rgba(31, 41, 55, 0.1);
        --ink: #18212f;
        --muted: #556274;
        --accent: #b45309;
        --accent-soft: rgba(180, 83, 9, 0.12);
        --accent-strong: #0f766e;
        --warning: #9a3412;
        --shadow: 0 16px 40px rgba(24, 33, 47, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI Variable", "Noto Sans TC", "PingFang TC", sans-serif;
      }

      .shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .hero-card {
        padding: 28px;
      }

      .eyebrow {
        display: inline-flex;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 8px;
        font-size: clamp(28px, 4vw, 44px);
        line-height: 1.05;
      }

      .summary {
        color: var(--muted);
        line-height: 1.7;
        margin: 0;
      }

      .status-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 18px;
      }

      .status-item {
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(31, 41, 55, 0.08);
      }

      .status-item strong {
        display: block;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        margin-bottom: 20px;
      }

      .pill-group {
        display: inline-flex;
        gap: 8px;
        padding: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(31, 41, 55, 0.08);
      }

      .pill-group button,
      .toolbar button {
        border: 0;
        cursor: pointer;
        font: inherit;
      }

      .pill {
        padding: 10px 16px;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
      }

      .pill.active {
        background: var(--ink);
        color: white;
      }

      .refresh {
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--accent-strong);
        color: white;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 20px;
      }

      .list-panel {
        padding: 8px;
      }

      .issue-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .issue-button {
        width: 100%;
        text-align: left;
        padding: 18px 20px;
        border: 0;
        border-radius: 18px;
        background: transparent;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }

      .issue-button:hover,
      .issue-button.active {
        background: rgba(15, 118, 110, 0.08);
        transform: translateY(-1px);
      }

      .issue-topline {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--muted);
      }

      .issue-title {
        font-size: 18px;
        line-height: 1.4;
        margin-bottom: 8px;
      }

      .issue-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(24, 33, 47, 0.06);
        color: var(--muted);
        font-size: 13px;
      }

      .details-panel {
        padding: 24px;
      }

      .details-panel h2 {
        margin-top: 0;
        font-size: 24px;
      }

      .details-empty {
        color: var(--muted);
        line-height: 1.7;
      }

      .detail-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-bottom: 18px;
      }

      .detail-card {
        padding: 14px;
        border-radius: 16px;
        background: rgba(24, 33, 47, 0.04);
      }

      .detail-card strong {
        display: block;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      pre {
        margin: 0;
        padding: 16px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        border-radius: 16px;
        background: #111827;
        color: #f9fafb;
        font-size: 13px;
        line-height: 1.55;
      }

      .warning-list {
        margin: 0;
        padding-left: 18px;
        color: var(--warning);
      }

      .muted {
        color: var(--muted);
      }

      a {
        color: var(--accent-strong);
      }

      @media (max-width: 960px) {
        .hero,
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="hero">
        <article class="panel hero-card">
          <span class="eyebrow">Local Tracker</span>
          <h1>把今天或昨天看過的 Easy Redmine issue 拉成可用清單</h1>
          <p class="summary">
            這個原型會讀你本機瀏覽器歷史紀錄，抓出
            <code>https://lawpj.lawbroker.com.tw/issues/&lt;id&gt;</code>
            這類網址，再用 Redmine API 補上 issue 資訊。右側選一天，左側就會列出當天看過的 issue。
          </p>
          <div class="status-grid">
            <div class="status-item">
              <strong>Redmine API</strong>
              <span id="api-status">載入中</span>
            </div>
            <div class="status-item">
              <strong>Issue Count</strong>
              <span id="issue-count">-</span>
            </div>
          </div>
        </article>

        <aside class="panel hero-card">
          <div class="status-item">
            <strong>可讀來源</strong>
            <div id="source-list" class="muted">載入中</div>
          </div>
        </aside>
      </section>

      <section class="panel toolbar">
        <div class="pill-group">
          <button class="pill active" data-day="today">今日</button>
          <button class="pill" data-day="yesterday">昨日</button>
        </div>
        <button class="refresh" id="refresh-button">重新整理</button>
      </section>

      <section class="layout">
        <article class="panel list-panel">
          <ul class="issue-list" id="issue-list"></ul>
        </article>

        <aside class="panel details-panel" id="details-panel">
          <h2>Issue 詳情</h2>
          <p class="details-empty">先從左側點一筆 issue，右邊會顯示 Redmine 資訊與對應 curl 範例。</p>
        </aside>
      </section>
    </div>

    <script>
      const state = {
        day: "today",
        issues: [],
        selectedIssueId: null,
      };

      const elements = {
        apiStatus: document.getElementById("api-status"),
        issueCount: document.getElementById("issue-count"),
        sourceList: document.getElementById("source-list"),
        issueList: document.getElementById("issue-list"),
        detailsPanel: document.getElementById("details-panel"),
        refreshButton: document.getElementById("refresh-button"),
        dayButtons: Array.from(document.querySelectorAll("[data-day]")),
      };

      const fmtDateTime = (value) => {
        const date = new Date(value);
        return new Intl.DateTimeFormat("zh-TW", {
          hour: "2-digit",
          minute: "2-digit",
          month: "2-digit",
          day: "2-digit",
        }).format(date);
      };

      const subjectOf = (issue) =>
        issue.redmine?.subject || issue.page_titles?.[0] || `Issue #${issue.issue_id}`;

      async function fetchConfig() {
        const response = await fetch("/api/config");
        const data = await response.json();
        elements.apiStatus.textContent = data.redmine_api_enabled ? "已設定 API key" : "未設定 API key";
        if (data.available_sources.length === 0) {
          elements.sourceList.textContent = "找不到可讀的瀏覽器歷史檔";
          return;
        }
        elements.sourceList.innerHTML = data.available_sources
          .map((source) => `<div><strong>${source.name}</strong><br><span class="muted">${source.path}</span></div>`)
          .join("");
      }

      async function fetchIssues() {
        elements.refreshButton.disabled = true;
        const response = await fetch(`/api/issues?day=${state.day}`);
        const data = await response.json();
        state.issues = data.issues;
        elements.issueCount.textContent = `${data.issue_count} 筆`;

        if (!state.issues.find((issue) => issue.issue_id === state.selectedIssueId)) {
          state.selectedIssueId = state.issues[0]?.issue_id ?? null;
        }

        renderIssues();
        await renderDetails(data.diagnostics.warnings);
        elements.refreshButton.disabled = false;
      }

      function renderIssues() {
        if (state.issues.length === 0) {
          elements.issueList.innerHTML = `
            <li>
              <div class="issue-button">
                <div class="issue-title">這一天沒有抓到符合條件的 issue 紀錄</div>
                <div class="muted">如果你是用無痕模式或其他瀏覽器，歷史紀錄可能不會被讀到。</div>
              </div>
            </li>
          `;
          return;
        }

        elements.issueList.innerHTML = state.issues
          .map((issue) => {
            const isActive = issue.issue_id === state.selectedIssueId;
            const redmine = issue.redmine || {};
            return `
              <li>
                <button class="issue-button ${isActive ? "active" : ""}" data-issue-id="${issue.issue_id}">
                  <div class="issue-topline">
                    <span>#${issue.issue_id}</span>
                    <span>${fmtDateTime(issue.last_visited_at)}</span>
                  </div>
                  <div class="issue-title">${subjectOf(issue)}</div>
                  <div class="issue-meta">
                    <span class="tag">${issue.visit_count} 次瀏覽</span>
                    <span class="tag">${issue.browser_sources.join(", ")}</span>
                    ${redmine.status ? `<span class="tag">${redmine.status}</span>` : ""}
                    ${redmine.project ? `<span class="tag">${redmine.project}</span>` : ""}
                  </div>
                </button>
              </li>
            `;
          })
          .join("");

        for (const button of elements.issueList.querySelectorAll("[data-issue-id]")) {
          button.addEventListener("click", async () => {
            state.selectedIssueId = Number(button.dataset.issueId);
            renderIssues();
            await renderDetails([]);
          });
        }
      }

      async function renderDetails(warnings = []) {
        const issue = state.issues.find((item) => item.issue_id === state.selectedIssueId);
        if (!issue) {
          elements.detailsPanel.innerHTML = `
            <h2>Issue 詳情</h2>
            <p class="details-empty">先從左側點一筆 issue，右邊會顯示 Redmine 資訊與對應 curl 範例。</p>
          `;
          return;
        }

        const now = new Date();
        const offsetDays = state.day === "yesterday" ? 1 : 0;
        now.setDate(now.getDate() - offsetDays);
        const spentOn = now.toISOString().slice(0, 10);

        const curlResponse = await fetch(`/api/curl-examples?issue_id=${issue.issue_id}&spent_on=${spentOn}`);
        const curlData = await curlResponse.json();
        const redmine = issue.redmine || {};

        elements.detailsPanel.innerHTML = `
          <h2>${subjectOf(issue)}</h2>
          <p><a href="${issue.issue_url}" target="_blank" rel="noreferrer">打開 Redmine issue #${issue.issue_id}</a></p>
          <div class="detail-grid">
            <div class="detail-card">
              <strong>最近瀏覽</strong>
              <span>${fmtDateTime(issue.last_visited_at)}</span>
            </div>
            <div class="detail-card">
              <strong>首次瀏覽</strong>
              <span>${fmtDateTime(issue.first_visited_at)}</span>
            </div>
            <div class="detail-card">
              <strong>狀態</strong>
              <span>${redmine.status || "未透過 API 取得"}</span>
            </div>
            <div class="detail-card">
              <strong>指派對象</strong>
              <span>${redmine.assigned_to || "-"}</span>
            </div>
          </div>
          ${
            warnings.length
              ? `<div class="detail-card"><strong>警告</strong><ul class="warning-list">${warnings
                  .map((warning) => `<li>${warning}</li>`)
                  .join("")}</ul></div>`
              : ""
          }
          <div class="detail-card" style="margin-top: 18px;">
            <strong>GET issue</strong>
            <pre>${curlData.get_issue || ""}</pre>
          </div>
          <div class="detail-card" style="margin-top: 18px;">
            <strong>GET 這一天的工時</strong>
            <pre>${curlData.get_time_entries || ""}</pre>
          </div>
          <div class="detail-card" style="margin-top: 18px;">
            <strong>POST 補登工時</strong>
            <pre>${curlData.post_time_entry || ""}</pre>
          </div>
        `;
      }

      async function setDay(day) {
        state.day = day;
        for (const button of elements.dayButtons) {
          button.classList.toggle("active", button.dataset.day === state.day);
        }
        await fetchIssues();
      }

      elements.refreshButton.addEventListener("click", () => fetchIssues());
      for (const button of elements.dayButtons) {
        button.addEventListener("click", () => setDay(button.dataset.day));
      }

      fetchConfig().then(() => fetchIssues());
    </script>
  </body>
</html>
